name: Reference source verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify reference source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @routeshift/shared build
      - run: python3 scripts/check_migration_tenant_ids.py
      - run: python3 scripts/check_microcent_scale.py
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify standalone policy toolkit
        working-directory: toolkits/policy-router
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
